services:
  - type: web
    name: hawthorne-legal-assistant
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hawthorne-legal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://hawthorne-legal-assistant.onrender.com
      - key: TRUSTED_HOSTS
        value: "*.onrender.com"
      - key: SECURE_COOKIES
        value: true
      - key: CALENDAR_MODE
        value: demo
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: TIMEZONE
        value: Europe/Skopje

databases:
  - name: hawthorne-legal-db
    plan: free
    databaseName: legal_assistant
    user: legal_assistant
