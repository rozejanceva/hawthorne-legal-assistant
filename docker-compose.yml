services:
  api:
    build:
      context: .
      target: api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./:/app"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      API_PROXY: http://api:8000
    volumes: ["./frontend:/app"]
    depends_on: [api]
